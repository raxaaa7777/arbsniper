name: Universal Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=== Поиск файлов проекта ==="
          $pyFile = Get-ChildItem -Recurse -Filter *.py \vert{} Where-Object {$_.FullName -notmatch "\\\.git" } | Select-Object -First 1
          $pkgJson = Get-ChildItem -Recurse -Filter package.json \vert{} Where-Object {$_.FullName -notmatch "node_modules" } | Select-Object -First 1
          $htmlFile = Get-ChildItem -Recurse -Filter *.html \vert{} Where-Object {$_.FullName -notmatch "node_modules" } | Select-Object -First 1

          if ($pyFile -and -not $pkgJson -and -not$htmlFile) {
            Write-Host "Сборка Python проекта: $($pyFile.FullName)"
            python -m pip install --upgrade pip pyinstaller
            $req = Get-ChildItem -Recurse -Filter requirements.txt | Select-Object -First 1
            if ($req) { pip install -r$req.FullName }
            pyinstaller --onefile --noconsole --name "ArbSniper" $pyFile.FullName
            New-Item -ItemType Directory -Force -Path "final-artifact" | Out-Null
            Copy-Item "dist/ArbSniper.exe" -Destination "final-artifact/"
            exit 0
          }

          $workDir = Join-Path$env:RUNNER_TEMP "arbsniper-app"
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          if ($pkgJson) {
            $projDir =$pkgJson.DirectoryName
            Push-Location $projDir
            npm install --legacy-peer-deps
            $pkgContent = Get-Content$pkgJson.FullName -Raw | ConvertFrom-Json
            if ($pkgContent.scripts -and$pkgContent.scripts.build) {
              npm run build
            }
            if (Test-Path "dist/index.html") {
              Copy-Item "dist/*" -Destination $workDir -Recurse -Force
            } elseif (Test-Path "build/index.html") {
              Copy-Item "build/*" -Destination $workDir -Recurse -Force
            } else {
              Get-ChildItem -Exclude "node_modules",".git" | Copy-Item -Destination $workDir -Recurse -Force
            }
            Pop-Location
          } elseif ($htmlFile) {
            $htmlDir =$htmlFile.DirectoryName
            Get-ChildItem -Path $htmlDir -Exclude ".git",".github" \vert{} Copy-Item -Destination $workDir -Recurse -Force
            if ($htmlFile.Name -ne "index.html") {
              Copy-Item (Join-Path $workDir $htmlFile.Name) (Join-Path$workDir "index.html") -Force
            }
          } else {
            $htmlLines = @(
              '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ArbSniper</title>',
              '<script src="https://cdn.tailwindcss.com"></script></head>',
              '<body class="bg-slate-950 text-white p-6"><div id="root">ArbSniper Ready</div></body></html>'
            )
            $htmlLines -join "`n" | Set-Content -Path (Join-Path $workDir "index.html") -Encoding UTF8
          }

          Push-Location $workDir

          $mainJsLines = @(
            "const { app, BrowserWindow } = require('electron');",
            "function createWindow () {",
            "  const win = new BrowserWindow({ width: 1280, height: 820, autoHideMenuBar: true, webPreferences: { nodeIntegration: true, contextIsolation: false } });",
            "  win.loadFile('index.html');",
            "}",
            "app.whenReady().then(createWindow);",
            "app.on('window-all-closed', () => app.quit());"
          )
          $mainJsLines -join "`n" | Set-Content -Path "electron-main.js" -Encoding UTF8

          $pkgLines = @(
            '{',
            '  "name": "arbsniper",',
            '  "version": "1.
