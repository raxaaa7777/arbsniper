[package]
name = "arbsniper"
version = "0.1.0"
description = "ArbSniper — радар P2P-спредов: находи окна, где купить USDT дешевле и продать дороже"
authors = ["ArbSniper contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "arbsniper"

[lib]
name = "arbsniper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Минимальный вес: LTO + strip (наследие Sentinel — тонкий бинарь).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
